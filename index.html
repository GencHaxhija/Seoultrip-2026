<!DOCTYPE html>
<html lang="de-CH"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seoul 2026 – Reiseplaner</title>
<style>
/* ===== Dunkles Dashboard-Design ===== */
:root{--bg:#0f1218;--card:#181d27;--card2:#202636;--line:#2a3142;--tx:#e8ecf3;--mu:#8b95a7;--ac:#ff6b81;--bl:#4cc9f0;--ok:#4ade80;--wa:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{padding:18px 16px 8px;max-width:980px;margin:auto}h1{margin:0;font-size:1.5rem}.sub{color:var(--mu);font-size:.9rem}
main{max-width:980px;margin:auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.card>summary,.card h3{font-weight:700;cursor:pointer}.card h3{margin:0 0 8px;font-size:1rem}
button,.btn,select,input,textarea{font:inherit;color:var(--tx)}
button,.btn{min-height:46px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--bl)}button.pri{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}button.dan{color:#ff8a8a}button:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;background:#0f1218;border:1px solid var(--line);border-radius:10px;font-size:16px}textarea{min-height:80px;resize:vertical}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chip{flex:0 0 auto;min-height:42px;padding:6px 12px}.chip.on{background:var(--bl);color:#0b1220;border-color:var(--bl);font-weight:700}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;padding:14px}
.dh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.dn{color:var(--ac);font-weight:700;font-size:.85rem}.dd{color:var(--mu);font-size:.9rem}.day h2{margin:2px 0 0;font-size:1.25rem}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:.8rem;color:var(--mu)}
.pill.fix{color:var(--ac);border-color:var(--ac)}.pill.flex{color:var(--bl);border-color:var(--bl)}
.sec{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}.sh b{font-size:1.05rem}
.list{min-height:12px}.list.over{outline:2px dashed var(--bl);border-radius:10px}
.act{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.act.warn{border-color:var(--wa)}.act.drag{opacity:.4}
.at{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.time{background:#0f1218;border:1px solid var(--bl);color:var(--bl);border-radius:8px;padding:2px 8px;font-weight:700;white-space:nowrap}
.atit{font-weight:700}.pl{color:var(--mu);font-size:.9rem}.nt{font-size:.9rem;margin-top:4px;white-space:pre-wrap}
.wr{background:#3a2d0a;color:var(--wa);border:1px solid var(--wa);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tools button,.tools a{min-height:40px;padding:4px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0b0e14;border-top:1px solid var(--line);padding:8px;display:flex;gap:8px;justify-content:center;z-index:5}.bar button{flex:1;max-width:220px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10}.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}body{padding-bottom:70px}}
#toast{position:fixed;top:10px;right:10px;background:var(--ok);color:#06220f;padding:8px 14px;border-radius:10px;font-weight:700;z-index:20;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}#toast.err{background:#ff6b6b;color:#220}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.food{border-top:1px solid var(--line);padding:8px 0}.food a{color:var(--bl)}
</style></head><body>
<header><h1>🇰🇷 Seoul 2026</h1><div class="sub" id="hdr"></div></header>
<div id="toast"></div>
<main>
<div class="card"><h3>Ansicht</h3><div class="row"><button data-a="vall">Alle Tage</button><button data-a="vone">Einzelner Tag</button><button class="pri" data-a="addday">+ Tag</button></div><div class="chips" id="chips"></div></div>
<details class="card"><summary>Daten (Export / Import)</summary>
<p class="sub" id="dstat"></p>
<div class="row"><button class="pri" data-a="expjson">⬇ Export (JSON)</button><button data-a="imp">⬆ Import (JSON)</button><button data-a="exptxt">Text-Export</button><button data-a="expcsv">CSV-Export</button><button data-a="share" id="shareBtn">Teilen</button><button data-a="legacy" id="legBtn" class="hidden">Alt-Backup laden</button><button class="dan" data-a="reset">Standardplan</button></div>
<p class="sub">Tipp: Am Computer exportieren, Datei per AirDrop/Mail/Cloud aufs Handy schicken und dort importieren.</p>
<input type="file" id="file" accept=".json,application/json" class="hidden"></details>
<div id="days"></div>
<details class="card"><summary>🍜 Essen, das wir probieren müssen (DE / 한국어)</summary><p class="sub">♥ = unbedingt probieren. Schärfe ist eine grobe Einschätzung.</p><div id="food"></div></details>
</main>
<div class="bar"><button data-a="prev">‹ Zurück</button><button data-a="vall">Alle</button><button data-a="next">Weiter ›</button></div>
<div class="ov hidden" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
/* ===== Konstanten & Helfer ===== */
const KEY='seoultrip2026.v2',LEG='seoultrip2026.legacy-backup',SECS=[['am','Vormittag'],['pm','Nachmittag'],['ev','Abend']];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naver=q=>'https://map.naver.com/p/search/'+encodeURIComponent(q);
const MIN=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const fmtD=iso=>iso?iso.split('-').reverse().join('.'):'';
const wd=iso=>iso?new Date(iso+'T12:00:00').toLocaleDateString('de-CH',{weekday:'long'}):'';
const fmtTs=t=>t?new Date(t).toLocaleString('de-CH',{dateStyle:'short',timeStyle:'short'}):'noch nie';
let S,tt;
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2200)}

/* ===== Standardplan (aus deiner Tagesplanung) ===== */
function A(sec,title,place,start,end,note,fix,tt){return{id:uid(),sec,title,place:place||'',start:start||'',end:end||'',timeText:tt||'',note:note||'',fix:!!fix,naver:''}}
function D(date,title,status,acts,note,todo){return{id:uid(),date,title,status,note:note||'',todo:todo||'',acts}}
function seed(){const O='offen';return{app:'seoultrip-2026',version:2,
settings:{view:'all',persons:3,period:'5.–15. Oktober 2026',lodging:'16-5 Sungmun 5-gil, Seoul 04137'},meta:{lastExport:null,lastImport:null},days:[
D('2026-10-05','Ankunftstag','flex',[A('am','Ankommen, Einreise, Gepäck und Fahrt zur Unterkunft','Noch offen','','','Ankunft rund um Mittag/Nachmittag',0,O),A('pm','Check-in und Pause (optional Yeonnam-dong)','Nahe Unterkunft','','','Eigenes Programm',0,O),A('ev','Palast bei Nacht','Gyeongbokgung Palace','','','',0,O)],'','Tickets Palast kaufen'),
D('2026-10-06','Seongsu','flex',[A('am','Foodmarket','','10:00','12:00'),A('pm','Genc Schule','Online','13:00','14:00'),A('pm','International Garden Show','Seongsu','14:00','17:00'),A('pm','Seongsu Café – Ort anschauen','Seongsu','17:00','19:00'),A('ev','Koreanisches BBQ (Jongno oder Euljiro); Clubnacht Hongdae, Geburtstag Mexicaner und Italo','Hongdae','19:00','04:00')]),
D('2026-10-07','Suwon Tagestrip (Baseball Suwoncampus)','fix',[A('am','Fitness','Changdeokgung Palace','10:00','12:00','Ort aus bisherigem Plan übernommen'),A('pm','Fahrt nach Suwon','Suwon','12:45','14:30','Genc muss für Visa-Karte Fingerprint im Campus machen',1),A('pm','Suwon Palast, Mauer besichtigen','Suwon','14:30','17:00'),A('ev','Baseballspiel','Suwon Baseball Stadium','17:30','21:00','Zeit prüfen',1),A('ev','Rückfahrt, Ausgang Euljiro gemütlich','Euljiro','22:00','01:00')],'Es werden noch andere Studenten dabei sein; der Koreaner bucht im Voraus.'),
D('2026-10-08','DMZ-Tour (geführte Tour mit Überläufer)','fix',[A('am','Früher Start; Frühstück zum Mitnehmen; organisierte DMZ-Tour','DMZ Imjingak','08:00','17:00','Originalpass mitnehmen!',1),A('pm','Fortsetzung der DMZ-Tour; Rückkehr nach Seoul am späten Nachmittag','DMZ Imjingak','','','',1,'bis 17:00/18:00'),A('ev','Han River Abend chillen mit Studifreunden (Buddyprogramm), falls Lust; Fahrrad am Han River','Itaewon','','','',0,O),A('ev','Itaewon Ausgang','Itaewon','','04:00','',0,'bis 04:00')]),
D('2026-10-09','Namsan, Shopping und Nachtleben','flex',[A('am','Fitness','Namsan Seoul Tower','11:00','12:30'),A('pm','Myeongdong Shopping; Namdaemun Market','Myeongdong','13:00','18:00'),A('ev','Drohnenshow!','Ttukseom Hangang Park','20:30','21:00','Zeit prüfen',1),A('ev','Ausgang Gangnam oder Itaewon','Gangnam','','','',0,'flexibel')],'Ausgang kann noch ändern'),
D('2026-10-10','FC Seoul gegen Jeju SK','fix',[A('am','Frühstück; Mangwon oder Han River; frühes Mittagessen','Mangwon Market','','','',0,O),A('pm','Zum Seoul World Cup Stadium; Spiel ab ca. 14:00 Uhr','Seoul World Cup Stadium','13:00','18:00','Anpfiff prüfen',1),A('ev','MMA Fight Night at DOMVS','Gangnam','20:00','00:00','',1),A('ev','Ausgang Gangnam/Apujeong','Apgujeong','','','',0,'nach Bedarf')]),
D('2026-10-11','Mountain','flex',[A('am','Bukhansan Mountain','Bukhansan','','','',0,O),A('ev','Ddoo ddoo car free Jamsugyo Festival','Jamsugyo','','','',0,O)]),
D('2026-10-12','Nami Island','flex',[A('am','Spätes Frühstück; Seoul Forest Spaziergang','Seoul Forest','','','',0,O),A('pm','Seongsu: Cafés, Concept Stores, Pop-ups und Streetwear','Seongsu-dong','','','',0,O),A('ev','Gangnam oder Hannam; Rooftop-Bar; optional Clubnacht','Gangnam','','','',0,O)]),
D('2026-10-13','Nami Island','flex',[A('am','OPTION B: früher Start nach Nami Island','Nami Island','','','',0,O),A('pm','Incheon: Jayu Park und Open Port – oder Nami Island und Garden of Morning Calm','Nami Island','','','',0,O),A('ev','Rückkehr; Abendessen und Bar oder Erholung','Itaewon','','','',0,O)]),
D('2026-10-14','Letzter Seoul-Tag','flex',[A('am','Lieblingsort oder offene Sehenswürdigkeit nachholen','','','','',0,O),A('pm','Letzte Einkäufe; Gepäck organisieren; Pause','Myeongdong','','','',0,O),A('ev','Abschlussessen; Rooftop-Bar und letzter Spaziergang am Han River','Han River Banpo','','','',0,O)]),
D('2026-10-15','Abreise','fix',[A('am','Frühstück; Check-out; Gepäck und Flughafentransfer je nach Flugzeit','','','','Abflug rund um Mittag/Nachmittag',1,O),A('pm','Flughafen und Check-in','','','','',1,O),A('ev','Rückflug nach Hause','','','','',1,O)])]}}

const FOOD=[['Gegrillte Innereien (Gopchang) – Gangnam Gop','곱창구이',1,0,'Je nach Würzung/Dip leicht scharf. Nur wenn man Innereien mag.','https://www.tripadvisor.com/Restaurant_Review-g294197-d14969098-Reviews-Gangnam_Gop-Seoul.html'],
['Schweinebauch (Samgyeopsal) – Yook Tong Ryeong','삼겹살',0,1,'Nicht scharf. Gemeinsam essen.',''],
['Hanwoo-Rind – Gabojeong','한우구이',0,1,'Nicht scharf. 20 Beilagen, Holzkohle, ca. 30 Min. mit dem Bus ab Zentrum; Alternative zu Schweinebauch.',''],
['Kartoffelknochen-Eintopf (Gamja-tang)','감자탕',2,0,'Meist scharf; gut gegen Kater. 245 Donggyo-ro, Mapo-gu, Seoul','https://www.songganegamjatang.com'],
['Korean Fried Chicken','치킨',1,1,'BBQ: 양념반황올반 + 생맥 (Zapfbier) zeigen. Kyochon: Honey Combo oder 양념반간장반 (halb scharf-süss, halb Soja). Yangnyeom = süss-scharf, Soja = nicht scharf.',''],
['Sojasaucen-Krabbe (Ganjang-gejang) – Jinmi Sikdang','간장게장',0,1,'Nicht scharf, roher Fisch/Krabbe. Michelin; Reservation nötig.','https://guide.michelin.com/kr/ko/seoul-capital-area/kr-seoul/restaurant/jinmi-sikdang'],
['Schweinefüsse (Jokbal)','족발',0,0,'Meist mild (scharfe Variante: 불족발). In Ssam-Blättern mit Gemüse.','https://english.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=59895'],
['Gegrillter Schlammaal (Jangeo-gui) – Yeongdong Jang-eo','장어구이',0,0,'Meist nicht scharf; auf Augenhöhe mit Schweinebauch.','https://seoulshopper.com/blogs/restaurants/yeongdong-jang-eo-grilled-eel']];

/* ===== Speichern, Laden, Migration ===== */
function save(msg){try{localStorage.setItem(KEY,JSON.stringify(S));toast(msg||'Gespeichert ✓')}catch(e){toast('Speichern fehlgeschlagen (Speicher voll/gesperrt). Bitte Export machen.',1)}}
function norm(o){ // Validierung + Migration auf Format v2
 if(!o||typeof o!=='object'||!Array.isArray(o.days))throw new Error('Keine gültige Reiseplan-Datei (Feld "days" fehlt).');
 const days=o.days.map(d=>({id:d.id||uid(),date:d.date||'',title:d.title||d.name||'',status:d.status==='fix'?'fix':'flex',note:d.note||d.notes||'',todo:d.todo||'',
  acts:(Array.isArray(d.acts)?d.acts:Array.isArray(d.activities)?d.activities:[]).map(a=>({id:a.id||uid(),sec:['am','pm','ev'].includes(a.sec)?a.sec:'am',title:a.title||'',place:a.place||'',start:a.start||'',end:a.end||'',timeText:a.timeText||'',note:a.note||'',fix:!!a.fix,naver:a.naver||''}))}));
 const b=seed();return{app:'seoultrip-2026',version:2,settings:Object.assign(b.settings,o.settings||{}),meta:Object.assign({lastExport:null,lastImport:null},o.meta||{}),days}}
function load(){
 try{const r=localStorage.getItem(KEY);if(r){S=norm(JSON.parse(r));return}}catch(e){}
 // Erststart: alte Browserdaten (falls vorhanden) als Backup sichern, nichts geht verloren
 try{const old={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k!==KEY&&k!==LEG&&/seoul|trip|reise/i.test(k))old[k]=localStorage.getItem(k)}
  if(Object.keys(old).length&&!localStorage.getItem(LEG))localStorage.setItem(LEG,JSON.stringify(old))}catch(e){}
 S=seed();save('Standardplan geladen ✓')}

/* ===== Zeitfenster, Überschneidung, Zusammenfassung ===== */
function win(a){const s=MIN(a.start);let e=MIN(a.end);if(s==null||e==null)return null;if(e<=s)e+=1440;return[s,e]}
function overlaps(d){const o=new Set(),w=d.acts.map(a=>[a,win(a)]).filter(x=>x[1]);for(let i=0;i<w.length;i++)for(let j=i+1;j<w.length;j++){const x=w[i][1],y=w[j][1];if(x[0]<y[1]&&y[0]<x[1]){o.add(w[i][0].id);o.add(w[j][0].id)}}return o}
function label(a){if(a.start&&a.end)return a.start+'–'+a.end;if(a.start)return'ab '+a.start;if(a.end)return'bis '+a.end;return a.timeText||'flexibel'}
function summary(d){let f=null,l=null;d.acts.forEach(a=>{const s=MIN(a.start),w=win(a);if(s!=null&&(!f||s<f.m))f={m:s,t:a.start};const lm=w?w[1]:s,lt=w?a.end:a.start;if(lm!=null&&(!l||lm>l.m))l={m:lm,t:lt}});
 return{n:d.acts.length,f:f&&f.t,l:l&&l.t,fix:d.acts.filter(a=>a.fix).length,flex:d.acts.filter(a=>!a.fix).length}}

/* ===== Rendering ===== */
function actHTML(d,a,ov){const link=a.naver||(a.place&&a.place!=='Noch offen'?naver(a.place):(a.title?naver(a.title):''));
 return`<div class="act${ov.has(a.id)?' warn':''}" draggable="true" data-aid="${a.id}" data-did="${d.id}"><div class="at"><span class="time">${esc(label(a))}</span><span class="atit">${esc(a.title||'(ohne Titel)')}</span><span class="pill ${a.fix?'fix':'flex'}">${a.fix?'Fix':'Flex'}</span>${ov.has(a.id)?'<span class="pill" style="color:var(--wa)">⚠ Überschneidung</span>':''}</div>${a.place?`<div class="pl">📍 ${esc(a.place)}</div>`:''}${a.note?`<div class="nt">${esc(a.note)}</div>`:''}
<div class="tools"><button data-a="up" data-d="${d.id}" data-i="${a.id}" title="Nach oben">↑</button><button data-a="down" data-d="${d.id}" data-i="${a.id}" title="Nach unten">↓</button><button data-a="edit" data-d="${d.id}" data-i="${a.id}">✎ Bearbeiten</button><button class="dan" data-a="del" data-d="${d.id}" data-i="${a.id}">🗑</button>${link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">🗺 Naver Map</a>`:''}</div></div>`}
function dayHTML(d,idx){const ov=overlaps(d),s=summary(d);
 const secs=SECS.map(([k,n])=>`<div class="sec"><div class="sh"><b>${n}</b><button class="pri" data-a="add" data-d="${d.id}" data-s="${k}">+ Aktivität hinzufügen</button></div><div class="list" data-did="${d.id}" data-sec="${k}">${d.acts.filter(a=>a.sec===k).map(a=>actHTML(d,a,ov)).join('')||'<div class="sub">Noch nichts geplant – hierher ziehen oder hinzufügen.</div>'}</div></div>`).join('');
 return`<section class="day"><div class="dh"><div><div class="dn">Tag ${idx+1} · ${d.status==='fix'?'FIX':'FLEX'}</div><div class="dd">${esc(wd(d.date))}, ${esc(fmtD(d.date))}</div><h2>${esc(d.title||'Ohne Titel')}</h2></div><button data-a="editday" data-d="${d.id}">✎ Tag</button></div>
<div class="sum"><span class="pill">${s.n} Aktivitäten</span><span class="pill">Start ${s.f||'–'}</span><span class="pill">Ende ${s.l||'–'}</span><span class="pill fix">${s.fix} Fix</span><span class="pill flex">${s.flex} Flex</span></div>
${ov.size?'<div class="wr">⚠ Zeitfenster überschneiden sich an diesem Tag (Planung bleibt trotzdem möglich).</div>':''}${secs}
<label>Tagesnotiz</label><textarea data-f="note" data-d="${d.id}" placeholder="Notizen, streichen, unbedingt machen …">${esc(d.note)}</textarea><label>Offene Punkte / Tickets / Reservationen</label><textarea data-f="todo" data-d="${d.id}">${esc(d.todo)}</textarea></section>`}
function render(){const v=S.settings.view;if(v!=='all'&&!S.days.some(d=>d.id===v))S.settings.view='all';const vv=S.settings.view;
 $('#hdr').textContent=`${S.settings.period} · ${S.settings.persons} Personen · 🏠 ${S.settings.lodging}`;
 $('#chips').innerHTML=`<button class="chip${vv==='all'?' on':''}" data-a="view" data-d="all">Alle</button>`+S.days.map((d,i)=>`<button class="chip${vv===d.id?' on':''}" data-a="view" data-d="${d.id}">T${i+1} · ${esc(fmtD(d.date).slice(0,5))}</button>`).join('');
 $('#days').innerHTML=S.days.map((d,i)=>[d,i]).filter(x=>vv==='all'||x[0].id===vv).map(x=>dayHTML(x[0],x[1])).join('')||'<div class="card">Keine Tage. Mit „+ Tag“ starten.</div>';
 $('#dstat').textContent=`Zuletzt exportiert: ${fmtTs(S.meta.lastExport)} · Zuletzt importiert: ${fmtTs(S.meta.lastImport)}`;
 $('#food').innerHTML=FOOD.map(f=>`<div class="food"><b>${f[3]?'♥ ':''}${esc(f[0])}</b><br>${esc(f[1])} · ${'🌶'.repeat(f[2])||'nicht scharf'}${f[2]?' ('+['','mild','scharf'][f[2]]+')':''}<div class="pl">${esc(f[4])}</div>${f[5]?`<a href="${esc(f[5])}" target="_blank" rel="noopener">Link</a>`:''}</div>`).join('');
 $('#legBtn').classList.toggle('hidden',!localStorage.getItem(LEG));$('#shareBtn').classList.toggle('hidden',!(navigator.canShare&&navigator.share))}

/* ===== Sheets (Formulare) ===== */
function sheet(h){$('#sheet').innerHTML=h;$('#ov').classList.remove('hidden')}
function closeSheet(){$('#ov').classList.add('hidden')}
function ask(msg,ok,cb,danger){sheet(`<h3>Bestätigen</h3><p>${msg}</p><div class="row"><button class="${danger?'dan':'pri'}" id="yes">${ok}</button><button data-a="close">Abbrechen</button></div>`);$('#yes').onclick=()=>{closeSheet();cb()}}
const dayById=id=>S.days.find(d=>d.id===id);
function actForm(did,aid,sec){const d=dayById(did),a=aid?d.acts.find(x=>x.id===aid):{sec,fix:false,title:'',place:'',start:'',end:'',timeText:'',note:'',naver:''};
 sheet(`<h3>${aid?'Aktivität bearbeiten':'Neue Aktivität'}</h3><form id="f" data-k="act" data-d="${did}" data-i="${aid||''}"><label>Titel *</label><input name="title" required value="${esc(a.title)}"><label>Ort</label><input name="place" value="${esc(a.place)}"><div class="g2"><div><label>Startzeit</label><input type="time" name="start" value="${esc(a.start)}"></div><div><label>Endzeit</label><input type="time" name="end" value="${esc(a.end)}"></div></div><div class="g2"><div><label>oder Dauer (Min.)</label><input type="number" name="dur" min="5" step="5" inputmode="numeric"></div><div><label>Ohne Uhrzeit</label><input name="timeText" placeholder="flexibel / nach Bedarf" value="${esc(a.timeText)}"></div></div><div class="g2"><div><label>Abschnitt</label><select name="sec">${SECS.map(s=>`<option value="${s[0]}"${a.sec===s[0]?' selected':''}>${s[1]}</option>`).join('')}</select></div><div><label>Status</label><select name="fix"><option value="0"${a.fix?'':' selected'}>Flex</option><option value="1"${a.fix?' selected':''}>Fix</option></select></div></div><label>Beschreibung / Notiz</label><textarea name="note">${esc(a.note)}</textarea><label>Naver-Map-Link (optional, sonst automatisch aus Ort)</label><input name="naver" type="url" placeholder="https://naver.me/…" value="${esc(a.naver)}"><div class="row" style="margin-top:14px"><button class="pri" type="submit">Speichern</button><button type="button" data-a="close">Abbrechen</button></div></form>`)}
function dayForm(did){const d=did?dayById(did):{date:S.days.length?new Date(new Date(S.days[S.days.length-1].date+'T12:00:00').getTime()+864e5).toISOString().slice(0,10):'',title:'',status:'flex'};
 sheet(`<h3>${did?'Tag bearbeiten':'Neuer Tag'}</h3><form id="f" data-k="day" data-d="${did||''}"><label>Tagesname</label><input name="title" value="${esc(d.title)}"><label>Datum</label><input type="date" name="date" required value="${esc(d.date)}"><label>Status</label><select name="status"><option value="flex"${d.status==='flex'?' selected':''}>Flex</option><option value="fix"${d.status==='fix'?' selected':''}>Fix</option></select><div class="row" style="margin-top:14px"><button class="pri" type="submit">Speichern</button>${did?'<button type="button" class="dan" data-a="delday" data-d="'+did+'">Tag löschen</button>':''}<button type="button" data-a="close">Abbrechen</button></div></form>`)}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.k,v=Object.fromEntries(new FormData(f));
 if(k==='act'){const d=dayById(f.dataset.d);let a=f.dataset.i&&d.acts.find(x=>x.id===f.dataset.i);const isNew=!a;if(isNew){a={id:uid()};}
  if(v.dur&&v.start&&!v.end){const m=MIN(v.start)+ +v.dur;v.end=String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
  Object.assign(a,{title:v.title.trim(),place:v.place.trim(),start:v.start,end:v.end,timeText:v.timeText.trim(),note:v.note,fix:v.fix==='1',naver:v.naver.trim(),sec:v.sec});
  if(isNew)d.acts.push(a);regroup(d)}
 else{let d=f.dataset.d&&dayById(f.dataset.d);if(!d){d={id:uid(),note:'',todo:'',acts:[]};S.days.push(d)}Object.assign(d,{title:v.title.trim(),date:v.date,status:v.status});S.days.sort((x,y)=>x.date.localeCompare(y.date));if(!f.dataset.d)S.settings.view=d.id}
 closeSheet();save();render()});
function regroup(d){d.acts=[].concat(...SECS.map(s=>d.acts.filter(a=>a.sec===s[0])))}
/* Sortieren: Auf/Ab, über Abschnittsgrenzen hinweg */
function moveAct(d,id,dir){const K=['am','pm','ev'],g={am:[],pm:[],ev:[]};d.acts.forEach(a=>g[a.sec].push(a));const a=d.acts.find(x=>x.id===id),k=K.indexOf(a.sec),L=g[a.sec],i=L.indexOf(a),j=i+dir;
 if(j>=0&&j<L.length){L[i]=L[j];L[j]=a}else{const nk=k+dir;if(nk<0||nk>2)return;L.splice(i,1);a.sec=K[nk];dir<0?g[K[nk]].push(a):g[K[nk]].unshift(a)}
 d.acts=[...g.am,...g.pm,...g.ev];save();render()}
function dropAct(did,aid,sec,before){const d=dayById(did),a=d.acts.find(x=>x.id===aid);if(!a||aid===before)return;d.acts=d.acts.filter(x=>x!==a);a.sec=sec;const i=before?d.acts.findIndex(x=>x.id===before):-1;if(i>=0)d.acts.splice(i,0,a);else{const last=d.acts.map(x=>x.sec).lastIndexOf(sec);d.acts.splice(last+1,0,a)}regroup(d);save();render()}

/* ===== Export / Import ===== */
function payload(){return{app:'seoultrip-2026',version:2,exportedAt:new Date().toISOString(),settings:S.settings,meta:S.meta,days:S.days}}
function dl(name,text,mime){const b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
const stamp=()=>new Date().toISOString().slice(0,10);
function stampExport(){S.meta.lastExport=Date.now();save('Exportiert & gespeichert ✓');render()}
function toText(){let t=`SEOUL 2026 – ${S.settings.period}\nUnterkunft: ${S.settings.lodging}\n\n`;S.days.forEach((d,i)=>{t+=`TAG ${i+1} – ${wd(d.date)}, ${fmtD(d.date)} – ${d.title} [${d.status.toUpperCase()}]\n`;SECS.forEach(([k,n])=>{const L=d.acts.filter(a=>a.sec===k);if(L.length){t+=`  ${n}\n`;L.forEach(a=>t+=`   - ${label(a)}  ${a.title}${a.place?' @ '+a.place:''} [${a.fix?'Fix':'Flex'}]${a.note?' – '+a.note.replace(/\n/g,' '):''}\n`)}});if(d.note)t+=`  Notiz: ${d.note}\n`;if(d.todo)t+=`  Offen: ${d.todo}\n`;t+='\n'});return t}
function toCSV(){const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"',r=[['Tag','Datum','Wochentag','Tagesname','Abschnitt','Von','Bis','Zeitangabe','Titel','Ort','Fix/Flex','Notiz','Naver']];S.days.forEach((d,i)=>d.acts.forEach(a=>r.push([i+1,fmtD(d.date),wd(d.date),d.title,SECS.find(s=>s[0]===a.sec)[1],a.start,a.end,label(a),a.title,a.place,a.fix?'Fix':'Flex',a.note,a.naver])));return'\ufeff'+r.map(x=>x.map(q).join(';')).join('\r\n')}
function doImport(file){const r=new FileReader();r.onerror=()=>toast('Datei konnte nicht gelesen werden.',1);r.onload=()=>{let n;try{n=norm(JSON.parse(r.result))}catch(e){toast('Import fehlgeschlagen: '+(e.message.startsWith('Keine')?e.message:'Die Datei ist kein gültiges JSON.'),1);return}
 const acts=n.days.reduce((s,d)=>s+d.acts.length,0);
 ask(`Import: <b>${n.days.length} Tage</b>, <b>${acts} Aktivitäten</b>.<br>Dein aktueller Plan (${S.days.length} Tage, ${S.days.reduce((s,d)=>s+d.acts.length,0)} Aktivitäten) wird <b>überschrieben</b>. Ein Sicherheits-Backup bleibt im Browser erhalten.`,'Ja, überschreiben',()=>{try{localStorage.setItem('seoultrip2026.pre-import',JSON.stringify(S))}catch(e){}n.meta.lastImport=Date.now();n.meta.lastExport=S.meta.lastExport;S=n;save('Importiert & gespeichert ✓');render()},1)};r.readAsText(file)}

/* ===== Events ===== */
document.addEventListener('click',e=>{if(e.target.id==='ov')return closeSheet();const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset.d,i=b.dataset.i,s=b.dataset.s,ids=S.days.map(x=>x.id);
 const setView=v=>{S.settings.view=v;save();render();window.scrollTo(0,0)};
 switch(a){case'close':closeSheet();break;case'vall':setView('all');break;case'vone':setView(S.settings.view!=='all'?S.settings.view:(ids[0]||'all'));break;case'view':setView(d);break;
 case'prev':case'next':{const c=ids.indexOf(S.settings.view),n=a==='next'?c+1:c-1;if(n<0)setView('all');else if(n<ids.length)setView(ids[n]);break}
 case'add':actForm(d,null,s);break;case'edit':actForm(d,i);break;case'up':moveAct(dayById(d),i,-1);break;case'down':moveAct(dayById(d),i,1);break;
 case'del':ask('Diese Aktivität löschen?','Löschen',()=>{const x=dayById(d);x.acts=x.acts.filter(y=>y.id!==i);save('Gelöscht & gespeichert ✓');render()},1);break;
 case'addday':dayForm();break;case'editday':dayForm(d);break;
 case'delday':ask('Diesen Tag mit allen Aktivitäten löschen?','Tag löschen',()=>{S.days=S.days.filter(y=>y.id!==d);save('Tag gelöscht ✓');render()},1);break;
 case'expjson':{const p=payload();dl(`seoul-reiseplan-${stamp()}.json`,JSON.stringify(p,null,2),'application/json');stampExport();break}
 case'exptxt':dl(`seoul-reiseplan-${stamp()}.txt`,toText(),'text/plain');stampExport();break;
 case'expcsv':dl(`seoul-reiseplan-${stamp()}.csv`,toCSV(),'text/csv');stampExport();break;
 case'share':{const f=new File([JSON.stringify(payload(),null,2)],`seoul-reiseplan-${stamp()}.json`,{type:'application/json'});navigator.share({files:[f],title:'Seoul Reiseplan'}).then(stampExport).catch(()=>{});break}
 case'imp':$('#file').click();break;
 case'legacy':{const o=localStorage.getItem(LEG);dl('seoul-alter-browserstand.json',o,'application/json');break}
 case'reset':ask('Auf den Standardplan zurücksetzen? Aktueller Plan wird überschrieben (Backup im Browser).','Zurücksetzen',()=>{try{localStorage.setItem('seoultrip2026.pre-import',JSON.stringify(S))}catch(x){}const m=S.meta;S=seed();S.meta=m;save('Zurückgesetzt ✓');render()},1);break}});
$('#file').addEventListener('change',e=>{if(e.target.files[0])doImport(e.target.files[0]);e.target.value=''});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.f){dayById(t.dataset.d)[t.dataset.f]=t.value;clearTimeout(window._sv);window._sv=setTimeout(()=>save(),500)}
 if(t.form&&t.form.id==='f'&&(t.name==='dur'||t.name==='start')){const f=t.form,s=MIN(f.start.value),du=+f.dur.value;if(s!=null&&du>0){const m=s+du;f.end.value=String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}}});
/* Drag & Drop (Desktop); auf dem Handy: Auf/Ab-Buttons */
let drag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.act');if(c){drag={d:c.dataset.did,a:c.dataset.aid};c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag.a)}});
document.addEventListener('dragend',()=>{drag=null;render()});
document.addEventListener('dragover',e=>{const l=e.target.closest&&e.target.closest('.list');if(l&&drag&&l.dataset.did===drag.d){e.preventDefault();l.classList.add('over')}});
document.addEventListener('dragleave',e=>{const l=e.target.closest&&e.target.closest('.list');if(l)l.classList.remove('over')});
document.addEventListener('drop',e=>{const l=e.target.closest&&e.target.closest('.list');if(!l||!drag||l.dataset.did!==drag.d)return;e.preventDefault();const c=e.target.closest('.act');dropAct(drag.d,drag.a,l.dataset.sec,c?c.dataset.aid:null)});
load();render();
</script></body></html>
